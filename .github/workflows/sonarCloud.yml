name: SonarCloud

on:
  push:
    branches: [ master, develop ]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  contract:
    name: Install trace-contract
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 21

      - name: Cache Maven packages
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-

      - name: Checkout contract-trace
        uses: actions/checkout@v3
        with:
          repository: Tr0n34/traces
          token: ${{ secrets.TRACE_SECRET }}
          path: traces
          fetch-depth: 0

      - name: Install traces parent + trace-contract
        run: mvn -f traces/pom.xml -DskipTests -pl :trace-contract -am clean install

  compile:
    name: Compile (fast fail)
    runs-on: ubuntu-latest
    needs: contract
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 21

      - name: Cache Maven packages
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-

      - name: Checkout contract-trace
        uses: actions/checkout@v3
        with:
          repository: Tr0n34/traces
          token: ${{ secrets.TRACE_SECRET }}
          path: traces
          fetch-depth: 0

      - name: Install traces parent + trace-contract
        run: mvn -f traces/pom.xml -DskipTests -pl :trace-contract -am clean install

      - name: Compile (skip tests)
        run: mvn -U -e -DskipTests clean compile

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: maven-binaries
          path: |
            **/target/classes
          if-no-files-found: error

  tests:
    name: Tests (JaCoCo)
    runs-on: ubuntu-latest
    needs: compile
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 21

      - name: Cache Maven packages
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-

      - name: Checkout contract-trace
        uses: actions/checkout@v3
        with:
          repository: Tr0n34/traces
          token: ${{ secrets.TRACE_SECRET }}
          path: traces
          fetch-depth: 0

      - name: Install traces parent + trace-contract
        run: mvn -f traces/pom.xml -DskipTests -pl :trace-contract -am clean install

      - name: Run tests + JaCoCo
        run: mvn -U -e test

      - name: Generate JaCoCo reports
        run: mvn -U -e -DskipTests jacoco:report jacoco:report-aggregate || true

      - name: Upload JaCoCo reports
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-reports
          path: |
            **/target/site/jacoco/jacoco.xml
            **/target/site/jacoco-aggregate/jacoco.xml
          if-no-files-found: warn

  sonar:
    name: SonarCloud Scan
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 21

      - name: Cache Maven packages
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-

      - name: Checkout contract-trace
        uses: actions/checkout@v3
        with:
          repository: Tr0n34/traces
          token: ${{ secrets.TRACE_SECRET }}
          path: traces
          fetch-depth: 0

      - name: Install traces parent + trace-contract
        run: mvn -f traces/pom.xml -DskipTests -pl :trace-contract -am clean install

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          name: maven-binaries
          path: .

      - name: Download JaCoCo reports
        uses: actions/download-artifact@v4
        with:
          name: jacoco-reports
          path: .

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@0303d6b62e310685c0e34d0b9cde218036885c4d
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=Tr0n34_private-prescription
            -Dsonar.organization=tr0n34
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.java.binaries=**/target/classes
            -Dsonar.coverage.jacoco.xmlReportPaths=**/target/site/jacoco/jacoco.xml,**/target/site/jacoco-aggregate/jacoco.xml