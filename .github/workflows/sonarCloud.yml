name: SonarCloud

on:
  push:
    branches:
      - master
      - develop
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  build:
    name: Build, Test & SonarCloud
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      # 2. Set up JDK 21
      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 21

      # 3. Cache Maven dependencies
      - name: Cache Maven packages
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-

      - name: Checkout contract-trace
        uses: actions/checkout@v3
        with:
          repository: Tr0n34/traces
          token: ${{ secrets.TRACE_SECRET }}
          path: traces

      - name: Install trace-contract in local Maven repo
        run: mvn -f traces/trace-contract/pom.xml -DskipTests clean install

      - name: Verify contract installed
        run: |
          mvn -f traces/trace-contract/pom.xml -q -DskipTests -pl :trace-contract help:evaluate -Dexpression=project.groupId -DforceStdout
          mvn -f traces/trace-contract/pom.xml -q -DskipTests -pl :trace-contract help:evaluate -Dexpression=project.version -DforceStdout
          find ~/.m2/repository -name "*trace-contract*.jar" | head

      - name: Show installed contract
        run: |
          ls -la ~/.m2/repository/fr/cnamts/cpam33/trace-contract/1.0-SNAPSHOT || true

      # 4. Build + tests + JaCoCo
      - name: Build with Maven
        run: mvn -U -e -DskipTests=false clean verify

      - name: Debug all binaries
        run: find . -type d -path "*target/classes"

      - name: Debug JaCoCo reports
        run: find . -name jacoco.xml

      # 5. SonarCloud analysis
      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@0303d6b62e310685c0e34d0b9cde218036885c4d
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=Tr0n34_private-prescription
            -Dsonar.organization=tr0n34
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.java.binaries=**/target/classes
            -Dsonar.coverage.jacoco.xmlReportPaths=**/target/site/jacoco/jacoco.xml,**/target/site/jacoco-aggregate/jacoco.xml
