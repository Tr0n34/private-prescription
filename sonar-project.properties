sonar.tests=.
sonar.test.inclusions=**/*Test.java,**/*TI.java
sonar.sources=ordonnance-application/src/main/java,ordonnance-domain/src/main/java,ordonnance-infrastructure/src/main/java
sonar.java.binaries=ordonnance-application/target/classes,ordonnance-domain/target/classes,ordonnance-infrastructure/target/classes
sonar.coverage.jacoco.xmlReportPaths=ordonnance-application/target/site/jacoco/jacoco.xml,ordonnance-domain/target/site/jacoco/jacoco.xml,ordonnance-infrastructure/target/site/jacoco/jacoco.xml

# Ignore S100 (method naming) only for test classes
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=java:S100
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*Test.java,**/*TI.java