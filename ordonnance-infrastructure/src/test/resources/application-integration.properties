spring.profile=integration

# ===============================
# Datasource H2 (in-memory)
# ===============================
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC


# ===============================
# H2 Console (tests / debug)
# ===============================
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Overriding pour les profils de tests d'intégration sur les beans
spring.main.allow-bean-definition-overriding=true

# Répertoire de sortie des PDF de test
ordonnance.pdf.output-directory=target/it-pdf