# ===============================
# ORDonnances -> H2
# ===============================
spring.datasource.ordonnances.hikari.jdbc-url=jdbc:h2:mem:ordonnances;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.ordonnances.hikari.driver-class-name=org.h2.Driver
spring.datasource.ordonnances.hikari.username=sa
spring.datasource.ordonnances.hikari.password=

# ===============================
# TRACES -> H2
# ===============================
spring.datasource.traces.hikari.jdbc-url=jdbc:h2:mem:traces;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.traces.hikari.driver-class-name=org.h2.Driver
spring.datasource.traces.hikari.username=sa
spring.datasource.traces.hikari.password=

# ===============================
# THESORIMED -> POSTGRES (réel)
# ===============================
spring.datasource.thesorimed.hikari.jdbc-url=jdbc:postgresql://localhost:5430/thesorimed_db
spring.datasource.thesorimed.hikari.driver-class-name=org.postgresql.Driver
spring.datasource.thesorimed.hikari.username=postgres
spring.datasource.thesorimed.hikari.password=123456789
spring.datasource.thesorimed.hikari.maximum-pool-size=4
spring.datasource.thesorimed.hikari.pool-name=thesorimed-ti-pool
spring.datasource.thesorimed.hikari.read-only=false
spring.datasource.thesorimed.hikari.auto-commit=false

# ===============================
# JPA per-PU (custom)
# ===============================

# ordonnancePU
ordonnance.jpa.packages=fr.cnamts.cpam33.ordonnance.infrastructure.out.entities.ordonnances
ordonnance.jpa.persistence-unit=ordonnancePU
ordonnance.jpa.properties.hibernate.hbm2ddl.auto=create-drop

# tracePU
trace.jpa.packages=fr.cnamts.cpam33.ordonnance.infrastructure.out.entities.traces
trace.jpa.persistence-unit=tracePU
trace.jpa.properties.hibernate.hbm2ddl.auto=create-drop
trace.jpa.properties.hibernate.jdbc.batch_size=500
trace.jpa.properties.hibernate.order_inserts=true
trace.jpa.properties.hibernate.jdbc.batch_versioned_data=true

# thesorimedPU
thesorimed.jpa.packages=fr.cnamts.cpam33.thesorimed.infrastructure.out.entities.thesorimed
thesorimed.jpa.persistence-unit=thesorimedPU
thesorimed.jpa.properties.hibernate.hbm2ddl.auto=none
thesorimed.jpa.properties.hibernate.connection.provider_disables_autocommit=true

# ===============================
# JPA (si tes configs JPA sont multi-EMF, laisse tes classes faire)
# ===============================
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC


# ===============================
# H2 Console (tests / debug)
# ===============================
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Overriding pour les profils de tests d'intégration sur les beans
spring.main.allow-bean-definition-overriding=true

# Répertoire de sortie des PDF de test
ordonnance.pdf.output-directory=target/it-pdf

# ===============================
# LOGGER
# ===============================
logging.level.fr.cnamts.cpam33.ordonnance.infrastructure.out.adapters.repositories.thesorimed=TRACE