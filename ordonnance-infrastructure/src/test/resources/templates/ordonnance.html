<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <style>
        body {
            font-family: Roboto, Arial, sans-serif;
            font-size: 12px;
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .section {
            margin-bottom: 15px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        th, td {
            border: 1px solid #000;
            padding: 6px;
        }
        th {
            background-color: #f0f0f0;
        }
        .footer {
            margin-top: 40px;
            text-align: right;
        }
    </style>
</head>

<body>

<div class="header">
    <h1>Ordonnance</h1>
</div>

<div class="section">
    <strong>Patient :</strong>
    <span th:text="${ordonnance.patientNomComplet}">Nom Prénom</span><br/>
    <strong>Date de naissance :</strong>
    <span th:text="${ordonnance.patientDateNaissance}">01/01/2000</span>
</div>

<div class="section">
    <strong>Médecin :</strong>
    <span th:text="${ordonnance.medecinNom}">Nom médecin</span>
</div>

<table>
    <thead>
    <tr>
        <th>Médicament</th>
        <th>Posologie</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="ligne : ${ordonnance.lignes}">
        <td th:text="${ligne.medicament}">Paracétamol</td>
        <td th:text="${ligne.posologie}">3/jour</td>
    </tr>
    </tbody>
</table>

<div class="footer">
    <p>
        Fait le <span th:text="${dateEmission}">01/01/2025</span>
    </p>
    <p>Signature :</p>
</div>

</body>
</html>
