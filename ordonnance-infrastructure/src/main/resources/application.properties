# ===============================
# Datasource POSTGRESQL
# ===============================
spring.datasource.ordonnances.hikari.jdbc-url=jdbc:postgresql://localhost:5432/ordonnance_db
spring.datasource.ordonnances.hikari.driver-class-name=org.postgresql.Driver
spring.datasource.ordonnances.hikari.username=postgres
spring.datasource.ordonnances.hikari.password=${DB_PASSWORD:123456789}
spring.datasource.ordonnances.hikari.maximum-pool-size=48
spring.datasource.ordonnances.hikari.pool-name=ordonnance-pool

spring.datasource.traces.hikari.jdbc-url=jdbc:postgresql://localhost:5431/trace_db?reWriteBatchedInserts=true
spring.datasource.traces.hikari.driver-class-name=org.postgresql.Driver
spring.datasource.traces.hikari.username=postgres
spring.datasource.traces.hikari.password=${DB_PASSWORD:123456789}
spring.datasource.traces.hikari.maximum-pool-size=4
spring.datasource.traces.hikari.minimum-idle=0
spring.datasource.traces.hikari.pool-name=trace-pool

spring.datasource.thesorimed.hikari.jdbc-url=jdbc:postgresql://localhost:5430/trace_db
spring.datasource.thesorimed.hikari.driver-class-name=org.postgresql.Driver
spring.datasource.thesorimed.hikari.username=postgres
spring.datasource.thesorimed.hikari.password=${DB_PASSWORD:123456789}
spring.datasource.thesorimed.hikari.maximum-pool-size=48
spring.datasource.thesorimed.hikari.pool-name=thesorimed-pool
spring.datasource.thesorimed.hikari.read-only=true

# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ===============================
# JPA per-PU (custom)
# ===============================

# ordonnancePU
ordonnance.jpa.packages=fr.cnamts.cpam33.ordonnance.infrastructure.out.entities.ordonnances
ordonnance.jpa.persistence-unit=ordonnancePU
ordonnance.jpa.properties.hibernate.hbm2ddl.auto=create-drop

# tracePU
trace.jpa.packages=fr.cnamts.cpam33.ordonnance.infrastructure.out.entities.traces
trace.jpa.persistence-unit=tracePU
trace.jpa.properties.hibernate.hbm2ddl.auto=create-drop
trace.jpa.properties.hibernate.jdbc.batch_size=500
trace.jpa.properties.hibernate.order_inserts=true
trace.jpa.properties.hibernate.jdbc.batch_versioned_data=true

# thesorimedPU
thesorimed.jpa.packages=fr.cnamts.cpam33.thesorimed.infrastructure.out.entities.thesorimed
thesorimed.jpa.persistence-unit=thesorimedPU
thesorimed.jpa.properties.hibernate.hbm2ddl.auto=none
thesorimed.jpa.properties.hibernate.connection.provider_disables_autocommit=true


# ===============================
# Ordonnance
# ===============================
ordonnance.repositories.editique=/srv/

ordonnance.cache.type=none

ordonnance.loaders.core_pool_size=1

# === Loaders et configuration du delay de databouncing
ordonnance.loaders.errors.reload-delay=5000
ordonnance.loaders.errors.file=file:D:\\DATA\\ordonnance\\ordonnance-infrastructure\\src\\main\\resources\\errors.json
ordonnance.loaders.errors.watcher.enabled=true
ordonnance.loaders.actesMetiers.reload-delay=5000
ordonnance.loaders.actesMetiers.file=file:D:\\DATA\\ordonnance\\ordonnance-infrastructure\\src\\main\\resources\\actes_metiers.json
ordonnance.loaders.actesMetiers.watcher.enabled=true
ordonnance.loaders.fonctions.reload-delay=5000
ordonnance.loaders.fonctions.file=file:D:\\DATA\\ordonnance\\ordonnance-infrastructure\\src\\main\\resources\\fonctions.json
ordonnance.loaders.fonctions.watcher.enabled=true

# === Writer + Queue de traitement des Traces
ordonnance.traces.writer.workers=2
ordonnance.traces.writer.restart-delay=2s
ordonnance.traces.writer.queue-capacity=50000
ordonnance.traces.writer.batch-size=500
ordonnance.traces.writer.flush-interval=50ms
ordonnance.traces.enqueue-executor.core-pool-size=2
ordonnance.traces.enqueue-executor.max-pool-size=4
ordonnance.traces.enqueue-executor.queue-capacity=20000
ordonnance.traces.enqueue-executor.thread-name-prefix=trace-enq-
ordonnance.traces.enqueue-executor.wait-for-tasks-to-complete-on-shutdown=false

# ===============================
# API Externe
# ===============================
patient.api.url=http://localhost:8081/sages2-web-local/api/v1/consultants
medecin.api.url=http://localhost:8081/sages2-web-local/api/v1/medecins

# ===============================
# Actuator
# ===============================
management.endpoints.web.exposure.include=health,info,error-catalog-watcher, metrics, prometheus
management.metrics.export.prometheus.enabled=true